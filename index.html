<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
   ========================================================= */

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    background:#121212;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   BOLINHAS FLUTUANTES
   ========================================================= */

.bolinha{

    position:absolute;

    border-radius:50%;

    overflow:visible;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,255,255,.2);

    will-change:
        left,
        top,
        width,
        height;

}


/* Imagem da bolinha */

.bolinha img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;

}


/* =========================================================
   MENSAGEM
   ========================================================= */

.mensagem{

    position:absolute;

    bottom:110%;
    left:50%;

    transform:
        translateX(-50%);

    background:#ff3333;

    color:#fff;

    padding:8px 12px;

    border-radius:8px;

    font-size:14px;

    font-weight:bold;

    white-space:nowrap;

    display:none;

    z-index:99999;

    box-shadow:
        0 0 10px rgba(0,0,0,.5);

    pointer-events:none;

}


/* Mostrar mensagem */

.bolinha:hover .mensagem,
.bolinhaCaida:hover .mensagem{

    display:block;

}


/* =========================================================
   ESTRELAS
   ========================================================= */

.estrelas{

    position:absolute;

    left:50%;
    top:50%;

    width:180%;
    height:180%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:5;

}


/* Estrela */

.estrela{

    position:absolute;

    transform:
        translate(-50%,-50%);

    font-size:32px;

    color:#444;

    text-shadow:
        0 0 4px #000;

}


/* Estrela ativa */

.estrela.ativa{

    color:#FFD700;

    text-shadow:

        0 0 2px #FFD700,

        0 0 8px #FFD700,

        0 0 16px #FFD700,

        0 0 25px #FFD700;

}


/* =========================================================
   BOLINHAS CAÍDAS
   ========================================================= */

.bolinhaCaida{

    position:absolute;

    border-radius:50%;

    overflow:visible;

    cursor:grab;

    background:#fff;

    border:4px solid #000;

    box-sizing:border-box;

    filter:grayscale(100%);

    box-shadow:
        0 5px 15px rgba(0,0,0,.8);

    user-select:none;

    touch-action:none;

    will-change:
        left,
        top;

}


/* Enquanto arrasta */

.bolinhaCaida.arrastando{

    cursor:grabbing;

    box-shadow:
        0 12px 25px
        rgba(255,255,255,.3);

    transform:
        scale(1.05);

}


/* Imagem */

.bolinhaCaida img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;

    pointer-events:none;

}


/* =========================================================
   IMAGEM QUE NÃO CARREGOU
   ========================================================= */

.imagemErro{

    width:100%;
    height:100%;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #333,
            #111
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:12px;

    text-align:center;

}


/* =========================================================
   CHÃO
   ========================================================= */

.chao{

    position:fixed;

    left:0;
    bottom:0;

    width:100%;

    height:4px;

    background:#fff;

    opacity:.12;

    pointer-events:none;

    z-index:1;

}


/* =========================================================
   EVITA SELEÇÃO DURANTE ARRASTAMENTO
   ========================================================= */

body.arrastando{

    user-select:none;

}


/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-width:600px){

    .mensagem{

        font-size:12px;

        padding:6px 9px;

    }

    .estrela{

        font-size:25px;

    }

}

</style>

let bolinhaArrastada = null;


/* =========================================================
   FUNÇÃO ALEATÓRIA
   ========================================================= */

function aleatorio(min,max){

    return Math.random() *
        (max - min) +
        min;

}


/* =========================================================
   LIMITAR VALOR
   ========================================================= */

function limitar(valor,min,max){

    return Math.max(
        min,
        Math.min(
            max,
            valor
        )
    );

}


/* =========================================================
   CRIAR ESTRELAS
   ========================================================= */

function criarEstrelas(
    div,
    quantidade
){

    const container =
        div.querySelector(
            ".estrelas"
        );


    const totalEstrelas = 5;


    for(
        let i = 0;
        i < totalEstrelas;
        i++
    ){

        const estrela =
            document.createElement(
                "span"
            );


        estrela.className =
            "estrela";


        if(
            i <
            (quantidade || 0)
        ){

            estrela.classList.add(
                "ativa"
            );

        }


        estrela.textContent =
            "★";


        const angulo =
            (
                Math.PI * 2 * i /
                totalEstrelas
            ) -
            Math.PI / 2;


        const raio = 32;


        const x =
            50 +
            Math.cos(angulo) *
            raio;


        const y =
            50 +
            Math.sin(angulo) *
            raio;


        estrela.style.left =
            x + "%";


        estrela.style.top =
            y + "%";


        container.appendChild(
            estrela
        );

    }

}


/* =========================================================
   TRATAMENTO DE IMAGEM
   ========================================================= */

function configurarImagem(
    img,
    nome
){

    img.addEventListener(

            const erro =
                document.createElement(
                    "div"
                );

            erro.className =

            erro.textContent =

            img.replaceWith(
                erro
            );

            console.warn(
                "Imagem não encontrada:",
                nome
            );

        }
    );

}


/* =========================================================
   CRIAR BOLINHA FLUTUANTE
   ========================================================= */

function criarBolinhaFlutuante(

){

        );


    div.className =

    div.innerHTML = `

        <span class="mensagem">
            ${item.frase}
        </span>

        <div class="estrelas"></div>

        <img
            src="${item.foto}"
            alt="${item.frase}"
            draggable="false"
        >

    `;


    document.body.appendChild(
        div
    );


    const imagem =
        div.querySelector("img");


    configurarImagem(
        imagem,
        item.foto
    );


    criarEstrelas(
        div,
        item.estrelas
    );


    /* Tamanho base */

    const tamanhoBase =
        aleatorio(
            60,
            120
        );


    /* Posição inicial
       sempre dentro da tela */

    const x =
        aleatorio(
            0,
            Math.max(
                0,
                window.innerWidth -
                tamanhoBase
            )
        );


    const y =
        aleatorio(
            0,
            Math.max(
                0,
                window.innerHeight -
                tamanhoBase
            )
        );


    const bolinha = {

        el:div,

        x:x,

        y:y,

        vx:
            (Math.random() * 1.5) +
            0.5,

        vy:
            (Math.random() * 1.5) +
            0.5,

        tamanhoBase:
            tamanhoBase,

        fase:
            Math.random() *
            Math.PI * 2

    };


    /* Define tamanho inicial */

    div.style.width =
        tamanhoBase + "px";


    div.style.height =
        tamanhoBase + "px";


    div.style.left =
        x + "px";


    div.style.top =
        y + "px";


    bolinhas.push(
        bolinha
    );

}

    );


    /* Tamanho */

    const tamanho =
        aleatorio(

        );


    /* Posição horizontal */

        aleatorio(

            Math.max(
                10,
                window.innerWidth -
                tamanho -
                10
            )
        );


    /* Começa um pouco acima
       do chão */

    const y =
        window.innerHeight -
        tamanho -
        aleatorio(
            0,
            100
        );


    const bolinha = {

        el:div,

        x:x,

        y:Math.max(
            0,
            y
        ),

        tamanho:tamanho,

        velocidadeY:0,

        gravidade:0.35,

        arrastando:false,

        offsetX:0,

        offsetY:0,

        pointerId:null

    };


    div.style.width =
        tamanho + "px";


    div.style.height =
        tamanho + "px";


    div.style.left =
        bolinha.x + "px";


    div.style.top =
        bolinha.y + "px";


    bolinhasCaidas.push(
        bolinha
    );


    configurarArrastamento(
        bolinha
    );

}

/* =========================================================
   ARRASTAMENTO COM POINTER EVENTS
   =========================================================
   
   Funciona com:
   - Mouse
   - Touch
   - Caneta
   
   Pointer Events unificam esses dispositivos.
   ========================================================= */

function configurarArrastamento(
    bolinha
){

    const elemento =
        bolinha.el;


    elemento.addEventListener(
        "pointerdown",
        function(event){

            /* Somente botão principal
               do mouse */

            if(
                event.pointerType ===
                "mouse" &&
                event.button !== 0
            ){

                return;

            }


            bolinhaArrastada =
                bolinha;


            bolinha.arrastando =
                true;


            bolinha.pointerId =
                event.pointerId;


            elemento.classList.add(
                "arrastando"
            );


            document.body.classList.add(
                "arrastando"
            );


            bolinha.offsetX =
                event.clientX -
                bolinha.x;


            bolinha.offsetY =
                event.clientY -
                bolinha.y;


            bolinha.velocidadeY =
                0;


            /* Mantém o pointer
               associado ao elemento */

            if(
                elemento.setPointerCapture
            ){

                try{

                    elemento.setPointerCapture(
                        event.pointerId
                    );

                }

                catch(e){

                    console.warn(
                        "Pointer capture:",
                        e
                    );

                }

            }


            event.preventDefault();

        }
    );

}


/* =========================================================
   MOVIMENTO GLOBAL
   ========================================================= */

document.addEventListener(
    "pointermove",
    function(event){

        const bolinha =
            bolinhaArrastada;


        if(
            !bolinha ||
            !bolinha.arrastando
        ){

            return;

        }


        if(
            bolinha.pointerId !==
            event.pointerId
        ){

            return;

        }


        /* Nova posição */

        bolinha.x =
            event.clientX -
            bolinha.offsetX;


        bolinha.y =
            event.clientY -
            bolinha.offsetY;


        /* Limite horizontal */

        bolinha.x =
            limitar(
                bolinha.x,
                0,
                Math.max(
                    0,
                    window.innerWidth -
                    bolinha.tamanho
                )
            );


        /* Limite vertical */

        bolinha.y =
            limitar(
                bolinha.y,
                0,
                Math.max(
                    0,
                    window.innerHeight -
                    bolinha.tamanho
                )
            );


        /* Atualiza imediatamente */

        bolinha.el.style.left =
            bolinha.x + "px";


        bolinha.el.style.top =
            bolinha.y + "px";


        event.preventDefault();

    },
    {
        passive:false
    }
);


/* =========================================================
   FINALIZAR ARRASTAMENTO
   ========================================================= */

function finalizarArrastamento(
    event
){

    const bolinha =
        bolinhaArrastada;


    if(
        !bolinha ||
        !bolinha.arrastando
    ){

        return;

    }


    if(
        bolinha.pointerId !==
        event.pointerId
    ){

        return;

    }


    bolinha.arrastando =
        false;


    bolinha.pointerId =
        null;


    bolinha.el.classList.remove(
        "arrastando"
    );


    document.body.classList.remove(
        "arrastando"
    );


    /* Pequeno impulso para
       voltar a cair */

    bolinha.velocidadeY =
        1;


    bolinhaArrastada =
        null;

}


/* Soltou */

document.addEventListener(
    "pointerup",
    finalizarArrastamento
);


/* Pointer cancelado */

document.addEventListener(
    "pointercancel",
    finalizarArrastamento
);


/* =========================================================
   ANIMAÇÃO DAS FLUTUANTES
   ========================================================= */

function animarFlutuantes(){

    const tempo =
        performance.now() /
        1000;


    bolinhas.forEach(
        b => {

            /* =================================================
               PULSAÇÃO
   
               Agora varia aproximadamente 15%.
               ================================================= */

            const escala =
                1 +
                Math.sin(
                    tempo * 1.2 +
                    b.fase
                ) * 0.15;


            const tamanho =
                b.tamanhoBase *
                escala;


            /* Movimento */

            b.x +=
                b.vx;


            b.y +=
                b.vy;


            /* =================================================
               COLISÃO ESQUERDA
               ================================================= */

            if(
                b.x <= 0
            ){

                b.x = 0;

                b.vx =
                    Math.abs(
                        b.vx
                    );

            }


            /* =================================================
               COLISÃO DIREITA
               ================================================= */

            if(
                b.x + tamanho >=
                window.innerWidth
            ){

                b.x =
                    Math.max(
                        0,
                        window.innerWidth -
                        tamanho
                    );

                b.vx =
                    -Math.abs(
                        b.vx
                    );

            }


            /* =================================================
               COLISÃO TOPO
               ================================================= */

            if(
                b.y <= 0
            ){

                b.y = 0;

                b.vy =
                    Math.abs(
                        b.vy
                    );

            }


            /* =================================================
               COLISÃO FUNDO
               ================================================= */

            if(
                b.y + tamanho >=
                window.innerHeight
            ){

                b.y =
                    Math.max(
                        0,
                        window.innerHeight -
                        tamanho
                    );

                b.vy =
                    -Math.abs(
                        b.vy
                    );

            }


            /* Atualiza tamanho */

            b.el.style.width =
                tamanho + "px";


            b.el.style.height =
                tamanho + "px";


            /* Atualiza posição */

            b.el.style.left =
                b.x + "px";


            b.el.style.top =
                b.y + "px";


            /* Camada */

            b.el.style.zIndex =
                Math.floor(
                    tamanho
                );

        }
    );

}


/* =========================================================
   ANIMAÇÃO DAS CAÍDAS
   ========================================================= */

function animarCaidas(){

    bolinhasCaidas.forEach(
        b => {

            /* Não aplica gravidade
               durante arrastamento */

            if(
                b.arrastando
            ){

                return;

            }


            /* Gravidade */

            b.velocidadeY +=
                b.gravidade;


            /* Movimento */

            b.y +=
                b.velocidadeY;


            /* Chão */

            const chao =
                window.innerHeight -
                b.tamanho;


            /* =================================================
               BATEU NO CHÃO
               ================================================= */

            if(
                b.y >= chao
            ){

                b.y =
                    chao;


                /* Pequeno quique */

                if(
                    Math.abs(
                        b.velocidadeY
                    ) > 2
                ){

                    b.velocidadeY *=
                        -0.25;

                }

                else{

                    b.velocidadeY =
                        0;

                }

            }


            /* =================================================
               LIMITES LATERAIS
               ================================================= */

            if(
                b.x < 0
            ){

                b.x = 0;

            }


            if(
                b.x + b.tamanho >
                window.innerWidth
            ){

                b.x =
                    Math.max(
                        0,
                        window.innerWidth -
                        b.tamanho
                    );

            }


            /* =================================================
               TOPO
               ================================================= */

            if(
                b.y < 0
            ){

                b.y = 0;

                b.velocidadeY =
                    0;

            }


            /* Atualiza */

            b.el.style.left =
                b.x + "px";


            b.el.style.top =
                b.y + "px";

        }
    );

}


/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */

function animar(){

    animarFlutuantes();

    animarCaidas();

    requestAnimationFrame(
        animar
    );

}


/* =========================================================
   INICIAR
   ========================================================= */

animar();


/* =========================================================
   REDIMENSIONAMENTO DA JANELA
   ========================================================= */

window.addEventListener(
    "resize",
    function(){

        /* -----------------------------------------------
           FLUTUANTES
           ----------------------------------------------- */

        bolinhas.forEach(
            b => {

                const tamanho =
                    b.tamanhoBase;


                b.x =
                    limitar(
                        b.x,
                        0,
                        Math.max(
                            0,
                            window.innerWidth -
                            tamanho
                        )
                    );


                b.y =
                    limitar(
                        b.y,
                        0,
                        Math.max(
                            0,
                            window.innerHeight -
                            tamanho
                        )
                    );

            }
        );


        /* -----------------------------------------------
           CAÍDAS
           ----------------------------------------------- */

        bolinhasCaidas.forEach(
            b => {

                b.x =
                    limitar(
                        b.x,
                        0,
                        Math.max(
                            0,
                            window.innerWidth -
                            b.tamanho
                        )
                    );


                const chao =
                    window.innerHeight -
                    b.tamanho;


                if(
                    b.y > chao
                ){

                    b.y =
                        chao;

                }


                if(
                    b.y < 0
                ){

                    b.y = 0;

                }

            }
        );

    }
);


/* =========================================================
   WAKE LOCK
   ========================================================= */

let wakeLock = null;


/* =========================================================
   ATIVAR WAKE LOCK
   ========================================================= */

async function ativarWakeLock(){

    /* Verifica suporte */

    if(
        !("wakeLock" in navigator)
    ){

        console.log(
            "Wake Lock não suportado."
        );

        return;

    }


    /* Wake Lock precisa de
       contexto seguro em navegadores
       que aplicam essa exigência */

    if(
        location.protocol !== "https:" &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ){

        console.log(
            "Wake Lock: use HTTPS para maior compatibilidade."
        );

        return;

    }


    try{

        /* Se já existe um Wake Lock,
           não solicita outro */

        if(
            wakeLock &&
            !wakeLock.released
        ){

            return;

        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        console.log(
            "Wake Lock ativado."
        );


        /* Quando o sistema liberar
           o Wake Lock */

        wakeLock.addEventListener(
            "release",
            function(){

                console.log(
                    "Wake Lock liberado."
                );

                wakeLock =
                    null;

            }
        );

    }

    catch(error){

        console.log(
            "Não foi possível ativar o Wake Lock:",
            error
        );

    }

}


/* =========================================================
   ATIVAR
   ========================================================= */

ativarWakeLock();


/* =========================================================
   VOLTOU PARA A PÁGINA
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            ativarWakeLock();

        }

    }
);


/* =========================================================
   LIMPEZA DO WAKE LOCK
   ========================================================= */

window.addEventListener(
    "beforeunload",
    async function(){

        if(
            wakeLock
        ){

            try{

                await wakeLock.release();

            }

            catch(e){

                console.log(e);

            }

        }

    }
);

</script>
